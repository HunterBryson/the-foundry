            <div class="h-pulse-row">
              ${pulses.map((p) => `<button type="button" class="h-pulse-btn ${p.cls}${ck.pulse === p.id ? ' on' : ''}" data-pulse="${p.id}" onclick="hopperCheckinPulse('${esc(c.id)}','${p.id}')">${p.label}</button>`).join('')}
            </div>
          </div>
          ${questionsHTML}
          ${reactsHTML}
          <div class="h-ci-note-row">
            <textarea class="h-ci-note" data-ci-note="${esc(c.id)}" rows="1" placeholder="Anything else for me?" autocomplete="off">${esc(ck.note || '')}</textarea>
          </div>
        </div>
        <details class="h-weak-det">
          <summary>Build details &amp; weakest spot</summary>
          <div class="h-det-stack">
            ${(c.drop || '').length > 160 ? `<div class="h-box"><div class="h-lbl">Full Drop</div><div class="h-val">${esc(c.drop)}</div></div>` : ''}
            ${itchText ? `<div class="h-box itch"><div class="h-lbl">The Itch</div><div class="h-val">${esc(itchText)}</div></div>` : ''}
            <div class="h-box bet"><div class="h-lbl">Our Swing</div><div class="h-val">${esc(swingText)}</div></div>
            ${firstClicks.length ? `<div class="h-box clicks"><div class="h-lbl">Try First</div><ul class="h-clicks-list">${firstClicks.map((cl) => `<li>${esc(cl)}</li>`).join('')}</ul></div>` : ''}
            <div class="h-box weak"><div class="h-lbl">Weakest Spot</div><div class="h-val">${esc(weakestText)}</div></div>
          </div>
        </details>
        <div class="h-next-moves">
          <button type="button" class="h-move-btn h-move-push${pushSt.cls}" data-push-id="${esc(c.id)}"${pushSt.dis} onclick="hopperPush('${esc(c.id)}', this)">${pushSt.html}</button>
          <button type="button" class="h-move-btn h-move-floor h-chop-btn${chopSt.cls}" data-chop-id="${esc(c.id)}"${chopSt.dis} onclick="hopperChop('${esc(c.id)}', this)">${chopSt.html}</button>
          <button type="button" class="h-move-btn h-move-real${pullSt.cls}" data-real-id="${esc(c.id)}"${pullSt.dis} onclick="hopperPull('${esc(c.id)}', '${esc(c.build || '')}', this)">${pullSt.html}</button>
        </div>
        <div class="h-quiet-row">
          <span class="h-quiet-hint">Tap M inside the live preview to pin notes</span>
          <div class="h-quiet-acts">
            <button type="button" class="h-quiet-link${parkSt.cls}" data-park-bench="${esc(c.id)}"${parkSt.dis} onclick="hopperPark('${esc(c.id)}', this)">${parkSt.html}</button>
            <button type="button" class="h-quiet-link is-scrap" data-scrap-bench="${esc(c.id)}" onclick="openHopperNuke('${esc(c.id)}')">Scrap</button>
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>`;

  const runningHTML = `<div class="sec">
    <div class="sec-h">
      <span class="sec-t">Running</span>
      <span class="sec-n ${running.length ? 'hot' : ''}">${running.length} / ${lim.running}</span>
    </div>
    ${!running.length ? `<div class="quiet">Nothing running right now.</div>` : running.map((c) => {
      const maxShots = lim.shots + (c.extraShots || 0);
      const taken = (c.shots || []).length;
      const isFlying = (c.shots || []).some((s) => s.status === 'flying');
      const steerSt = btnStateAttrs('hsteer:' + c.id, 'Steer');
      return `<div class="h-card run-card" data-hopper-card="${esc(c.id)}">
        <div class="h-top">
          <span class="h-id">${esc(c.id)}</span>
          <span class="h-tag shot">Shot ${taken}/${maxShots}</span>
          ${isFlying ? `<span class="working">flying</span>` : ''}
          ${c.mode ? `<span class="h-tag mode">${esc(c.mode)}</span>` : ''}
          ${c.run && c.run !== c.mode ? `<span class="h-tag">${esc(c.run)}</span>` : ''}
          <span class="card-right">${ago(c.updated || c.at)}</span>
        </div>
        <div class="h-title">${esc(c.drop)}</div>
        <div class="h-box hard"><div class="h-lbl">The Hard Part</div><div class="h-val">${esc(c.hard || 'Framing…')}</div></div>
        ${c.brief ? `<div class="h-steer-prev"><b>Next steer:</b> ${esc(c.brief)}</div>` : ''}
        <div class="h-steer-row">
          <textarea class="h-steer-in" data-steer-id="${esc(c.id)}" rows="1" placeholder="Optional steer for next shot…" autocomplete="off"></textarea>
          <button class="btn${steerSt.cls}"${steerSt.dis} onclick="hopperSteer('${esc(c.id)}', this)">${steerSt.html}</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;

  const renderQueueItem = (c) => {
    const rnSt = btnStateAttrs('hrunnow:' + c.id, 'Run Now');
    const pkSt = btnStateAttrs('hpark:' + c.id, 'Park');
    const clSt = btnStateAttrs('hclear:' + c.id, 'Clear');
    const requested = Boolean(c.runNowAt || c.runNowRequested);
    return `<div class="h-qitem ${(c.from === 'you' || c.from === 'user') ? 'is-you' : 'is-agent'}" data-hopper-q="${esc(c.id)}">
      <div class="h-qdrop">${esc(c.drop)}</div>
      <div class="h-qmeta">
        <span class="h-id">${esc(c.id)}</span>
        ${c.hint ? `<span class="h-tag hint">${esc(HINT_LABELS[c.hint] || c.hint)}</span>` : ''}
        ${c.hard ? `<span><b>Hard part:</b> ${esc(c.hard)}</span>` : `<span>Queued for framing</span>`}
        ${c.mode ? `<span class="h-tag mode">${esc(c.mode)}</span>` : ''}
        ${c.run && c.run !== c.mode ? `<span class="h-tag">${esc(c.run)}</span>` : ''}
        <span style="margin-left:auto">${ago(c.at)}</span>
      </div>
      ${c.brief ? `<div class="h-steer-prev"><b>Steer:</b> ${esc(c.brief)}</div>` : ''}
      <div class="h-qsteer-row">
        ${requested
          ? `<span class="h-tag steer">Run Now · skipping settle</span>`
          : `<span class="h-tag mode">${c.hard ? 'Framed · queued' : 'Queued · 60s settle'}</span>`}
        <div class="h-q-btns">
          <button class="btn ghost h-q-act${pkSt.cls}" data-park-q="${esc(c.id)}"${pkSt.dis} onclick="hopperPark('${esc(c.id)}', this)">${pkSt.html}</button>
          <button class="btn danger h-q-act${clSt.cls}" data-clear-q="${esc(c.id)}"${clSt.dis} onclick="hopperClearQueued('${esc(c.id)}', this)">${clSt.html}</button>
          ${requested ? '' : `<button class="btn primary h-run-now${rnSt.cls}" data-run-now="${esc(c.id)}"${rnSt.dis} onclick="hopperRunNow('${esc(c.id)}', this)">${rnSt.html}</button>`}
        </div>
      </div>
    </div>`;
  };

  const queueHTML = `<div class="sec">
    <div class="sec-h"><span class="sec-t">Queue</span><span class="sec-n">${queue.length}</span></div>
    ${!queue.length ? `<div class="quiet">Queue is empty.</div>` : `
      ${yourQueue.length ? `<div class="h-subh"><span class="dot green"></span>Your Drops (${yourQueue.length})</div>${yourQueue.map(renderQueueItem).join('')}` : ''}
      ${agentQueue.length ? `<div class="h-subh"><span class="dot violet"></span>Agent-Spotted (${agentQueue.length})</div>${agentQueue.map(renderQueueItem).join('')}` : ''}
    `}
  </div>`;

  const parkedHTML = parked.length ? `<div class="sec">
    <button class="h-grave-btn" id="hParkedToggle" onclick="state.parkedOpen=!state.parkedOpen;renderLeft()">
      <span>Parked (${parked.length})</span>
      <span>${state.parkedOpen ? '▾ Hide' : '▸ Show'}</span>
    </button>
    ${state.parkedOpen ? `<div class="h-grave-list">
      ${parked.map((c) => {
        const clSt = btnStateAttrs('hclear:' + c.id, 'Clear');
        return `<div class="h-qitem" data-hopper-parked="${esc(c.id)}">
          <div class="h-qdrop"><span class="h-id" style="margin-right:6px">${esc(c.id)}</span>${esc(c.drop)}</div>
          ${c.parked?.why ? `<div class="h-gend">${esc(c.parked.why)}</div>` : ''}
          <div class="h-qsteer-row">
            <span class="h-tag mode">Parked ${ago(c.parked?.at || c.updated || c.at)}</span>
            <div class="h-q-btns">
              <button class="btn ghost h-q-act" onclick="openHopperAgain('${esc(c.id)}')">One More Shot</button>
              <button class="btn danger h-q-act${clSt.cls}" data-clear-parked="${esc(c.id)}"${clSt.dis} onclick="hopperClearQueued('${esc(c.id)}', this)">${clSt.html}</button>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>` : ''}
  </div>` : '';

  const graveyardHTML = `<div class="sec">
    <button class="h-grave-btn" id="hGraveToggle" onclick="state.graveOpen=!state.graveOpen;renderLeft()">
      <span>Graveyard (${graveyard.length})</span>
      <span>${state.graveOpen ? '▾ Hide' : '▸ Show'}</span>
    </button>
    ${state.graveOpen ? `<div class="h-grave-list">
      ${!graveyard.length ? `<div class="quiet" style="padding:10px 4px">Nothing nuked yet.</div>` : graveyard.map((c) => `<div class="h-gitem">
        <div class="h-gdrop"><span class="h-id" style="margin-right:6px">${esc(c.id)}</span>${esc(c.drop)}</div>
        <div class="h-gend">${esc(c.ended || 'Ended')}</div>
      </div>`).join('')}
    </div>` : ''}
  </div>`;

  const pb = h.playbook || {
    items: [
      { title: 'Name the itch, not a spec', body: 'What feels annoying or what 3-second moment you wish you had. Knowing the *why* lets your AI pit 2–3 real angles against each other.' },
      { title: "Where you'll hold it", body: '*Thumb at work · Desktop at night · Inside Floor/Schedule · Not sure yet.*' },
      { title: 'Pick your swing style', body: '*Explore angles (2–3 wild contenders) · Upgrade ours · Prototype · Deep scout.*' },
      { title: 'Any gut "don\'t"', body: 'One quick line like *"don\'t make it feel like homework"* or *"keep it dead simple."*' },
    ],
    note: 'Raw one-line voice dumps from work are always enough — never hold back a spark.',
  };
  const pbInline = (s = '') => esc(s).replace(/\*([^*]+)\*/g, '<i>$1</i>');
  const pbDraft = state.playbookEditing && state.playbookDraft ? state.playbookDraft : pb;
  const pbSaveSt = btnStateAttrs('hplaybook', 'Save');
  const playbookHTML = `<div class="sec">
    <div class="h-pb-card" id="hPlaybookCard">
      <div class="h-pb-head">
        <span class="h-pb-title">Drop Framework · Quick Reference</span>
        ${state.playbookEditing
          ? ''
          : `<button type="button" class="tlink" id="hPlaybookEditBtn" onclick="openPlaybookEditor()">Edit</button>`}
      </div>
      ${state.playbookEditing ? `<div id="hPlaybookEditor">
        ${(pbDraft.items || []).map((it, idx) => `<div class="h-pb-edit-row" data-pb-idx="${idx}">
          <div class="h-pb-edit-top">
            <span class="h-pb-num">${idx + 1}</span>
            <input type="text" class="h-pb-edit-in" data-pb-title="${idx}" value="${esc(it.title || '')}" placeholder="Point title…" oninput="syncPlaybookDraft()">
            ${(pbDraft.items || []).length > 1 ? `<button type="button" class="btn icon-close" title="Remove point" onclick="removePlaybookPoint(${idx})">✕</button>` : ''}
          </div>
          <textarea class="h-pb-edit-ta" data-pb-body="${idx}" rows="2" placeholder="Guidance…" oninput="syncPlaybookDraft()">${esc(it.body || '')}</textarea>
        </div>`).join('')}
        <div class="h-field" style="margin-top:8px;margin-bottom:10px">
          <label for="hPlaybookNoteIn">Footer note</label>
          <input id="hPlaybookNoteIn" type="text" class="h-pb-edit-in" value="${esc(pbDraft.note || '')}" placeholder="Closing note…" oninput="syncPlaybookDraft()">
        </div>
        <div class="actions" style="margin-top:10px">
          <button type="button" class="btn ghost" onclick="addPlaybookPoint()">+ Add point</button>
          <button type="button" class="btn ghost" style="margin-left:auto" onclick="cancelPlaybookEditor()">Cancel</button>
          <button type="button" class="btn primary${pbSaveSt.cls}" id="hPlaybookSaveBtn"${pbSaveSt.dis} onclick="savePlaybook(this)">${pbSaveSt.html}</button>
        </div>
      </div>` : `<div class="h-pb-list">
        ${(pb.items || []).map((it, idx) => `<div class="h-pb-item">
          <span class="h-pb-num">${idx + 1}</span>
          <div>${it.title ? `<span class="h-pb-lead">${esc(it.title)}</span>${it.body ? ' — ' : ''}` : ''}${pbInline(it.body || '')}</div>
        </div>`).join('')}
      </div>
      ${pb.note ? `<div class="h-pb-foot">${pbInline(pb.note)}</div>` : ''}`}
    </div>
  </div>`;

  return `${caretakerBarHTML}${haltedHTML}${benchHTML}${runningHTML}${queueHTML}${parkedHTML}${graveyardHTML}${playbookHTML}`;
}

function hopperViewHTML(){
  return `${hopperDropBarHTML()}<div id="hopperBody">${hopperBodyHTML()}</div>`;
}

function composerHTML(){
  const fl = state.flagging; if (!fl) return '';
  const targets = [
    {id:'antigravity', label:'Breaker (run now)'},
    {id:'builder', label:'Builder'},
    {id:'you', label:'Note for me'},
  ];
  const st = btnStateAttrs('submitFlag', 'Send flag');
  return `<div class="composer">
    <textarea id="flagNote" placeholder="Note (optional — Enter to send)"></textarea>
    <div class="crow"><span class="clbl">To</span>${targets.map(t=>`<button class="seg ${fl.for===t.id?'on':''}" onclick="state.flagging.for='${t.id}';state.flagging.send=${t.id==='antigravity'};renderLeft()">${t.label}</button>`).join('')}</div>
    <div class="crow"><span class="clbl">Kind</span>${['Review','Fix','Skill check','Clean up'].map(t=>`<button class="seg ${fl.tag===t?'on':''}" onclick="state.flagging.tag='${t}';renderLeft()">${t}</button>`).join('')}
      <button class="btn ghost" style="margin-left:auto" onclick="state.flagging=null;renderLeft()">Cancel</button>
      <button class="btn primary${st.cls}"${st.dis} onclick="submitFlag(this)">${st.html}</button>
    </div></div>`;
}

function repoHeaderHTML(relPath){
  const parts = relPath.split('/');
  const last = parts.pop();
  const crumbs = [`<button class="crumb-btn" onclick="select(null)">Foundry</button>`];
  let acc = '';
  for (const seg of parts) {
    acc = acc ? acc + '/' + seg : seg;
    crumbs.push(`<span class="crumb-sep">/</span><button class="crumb-btn" data-reveal="${esc(acc)}">${esc(seg)}</button>`);
  }
  crumbs.push(`<span class="crumb-sep">/</span>`);
  return `<div class="repo-hdr">
    <div class="crumbs">${crumbs.join('')}</div>
    <div class="repo-title-row"><span class="repo-title">${esc(last)}</span></div>
  </div>`;
}

function inspectorHTML(){
  const f = state.focus; if (!f) return '';
  const parts = f.path.split('/'); const last = parts.pop();
  const pinned = state.board.pins.some(x=>x.path===f.path);
  let stat = '', diffHtml = '', repoBtns = '', dangerZone = '';
  if (f.repo){
    const r = f.repo, bits = [];
    if (r.room==='lab'){
      const vs = r.vs;
      if (vs.state==='ahead'){
        bits.push(`${vs.ahead} update${vs.ahead>1?'s':''} ahead of core`);
        if (vs.commits?.length) diffHtml = `<div class="summary">${vs.commits.map(c=>`<div class="summary-item">${esc(c.text)} <span class="card-sub">· ${esc(c.by)} ${ago(c.at)}</span></div>`).join('')}</div>`;
        const pSt = btnStateAttrs('promote:' + last, 'Move to core');
        const cSt = btnStateAttrs('check:' + f.path + ':antigravity', 'Verify on bench');
        const hasCase = (state.board.attention || []).some(x => x.type === 'promote' && x.lab === last);
        if (hasCase) repoBtns += `<button class="btn primary${pSt.cls}"${pSt.dis} onclick="promote('${esc(last)}', this)">${pSt.html}</button>`;
        else bits.push('no case made for core');
        repoBtns += `<button class="btn${cSt.cls}"${cSt.dis} onclick="checkUpdate('${esc(f.path)}','${esc(vs.title)}','antigravity', this)">${cSt.html}</button>`;
      } else if (vs.state==='same') bits.push(`In core & synced`);
      else if (vs.state==='no-core') {
        bits.push(`Lab only`);
        const pSt = btnStateAttrs('promote:' + last, 'Start core');
        repoBtns += `<button class="btn primary${pSt.cls}"${pSt.dis} onclick="promote('${esc(last)}', this)">${pSt.html}</button>`;
      }
      else if (vs.state==='diverged') bits.push(`Split from core`);
      if (r.changes) bits.push(`${r.changes} unsaved`);
      if (vs?.core?.rel) repoBtns += `<button class="btn ghost" onclick="reveal('${esc(vs.core.rel)}')">Open core</button>`;
    } else if (r.room==='core'){
      bits.push(`Core${r.version?` · ${esc(r.version)}`:''}`);
      if (r.changes) bits.push(`${r.changes} hand edit(s)`);
      if (r.canRollback) {
        const rbSt = btnStateAttrs('rollback:' + last, `Roll back core/${last}`);
        dangerZone = `<div class="danger-zone">
          <div class="dz-text">
            <div class="dz-title">Undo last move to core</div>
            <div class="dz-sub">Separated from regular controls so a slipped thumb can't trigger it.</div>
          </div>
          <button class="btn danger${rbSt.cls}"${rbSt.dis} onclick="openRollbackConfirm('${esc(last)}')">${rbSt.html}</button>
        </div>`;
      }
    }
    stat = `<div class="ins-stat">${bits.join(' · ')}</div>`;
  }
  let extra = '';
  if (f.text != null) extra = `<div class="preview">${/\.md$/i.test(f.path)?`<div class="md">${md(f.text)}</div>`:`<pre>${esc(f.text)}</pre>`}</div>`;
  else if (f.image) extra = `<div class="preview"><img src="/api/raw?path=${encodeURIComponent(f.path)}"></div>`;
  else if (f.readme) extra = `<div class="preview"><div class="preview-hdr"><span class="card-sub">${esc(f.readme.name)}</span><button class="tlink" onclick="reveal('${esc(f.path + '/' + f.readme.name)}')">Open full</button></div><div class="md">${md(f.readme.text)}</div></div>`;

  const pinSt = btnStateAttrs('pin:' + f.path, pinned ? 'Unpin' : 'Pin focus');
  return `<div class="inspector">
    <div class="ins-head">
      ${repoHeaderHTML(f.path)}
      <button class="btn icon-close" style="margin-left:auto" onclick="select(null)" title="Close">✕</button>
    </div>
    ${stat}${diffHtml}
    <div class="actions">
      ${repoBtns}
      <button class="btn${pinSt.cls}"${pinSt.dis} onclick="togglePin('${esc(f.path)}', this)">${pinSt.html}</button>
      ${state.flagging?'':`<button class="btn" onclick="state.flagging={for:'antigravity',tag:'Review',send:true};renderLeft();setTimeout(()=>$('#flagNote').focus(),20)">Flag</button>`}
      <button class="btn ghost desktop-only" onclick="api('/api/open',{path:'${esc(f.path)}'}).then(()=>toast('Opened in Explorer','ok'))">Explorer</button>
      <button class="btn ghost" onclick="copyPath('${esc(f.path)}')">Copy path</button>
    </div>
    ${composerHTML()}${dangerZone}${extra}
  </div>`;
}

function glanceHeroHTML(b){
  const att = b.attention || [];
  const standings = b.standings || [];
  const blocks = b.blocks || [];
  const moves = att.filter(x => x.type === 'promote' || x.type === 'start-core').length;
  const flags = att.filter(x => x.type === 'flag').length;
  const alerts = att.filter(x => x.type === 'diverged' || x.type === 'core-edited').length;
  const inCore = standings.filter(s => s.state === 'same').length;
  if (!att.length) {
    return `<div class="glance clear">
      <div class="glance-ico">✓</div>
      <div class="glance-body">
        <div class="glance-title">All clear — nothing needs you</div>
        <div class="glance-sub">${standings.length} projects tracked · ${inCore} synced in core${blocks.length ? ` · ${blocks.length} blocked` : ''}</div>
        ${isPhone() ? `<div class="glance-links">
          <button class="tlink" onclick="setTab('progress')">Check progress →</button>
          <button class="tlink" onclick="setTab('activity')">See activity →</button>
        </div>` : ''}
      </div>
    </div>`;
  }
  const bits = [];
  if (moves) bits.push(`${moves} proposed for core`);
  if (flags) bits.push(`${flags} open flag${flags>1?'s':''}`);
  if (alerts) bits.push(`${alerts} warning${alerts>1?'s':''}`);
  if (blocks.length) bits.push(`${blocks.length} blocked`);
  return `<div class="glance needs">
    <div class="glance-ico">${att.length}</div>
    <div class="glance-body">
      <div class="glance-title">${att.length === 1 ? '1 thing needs you' : `${att.length} things need you`}</div>
      <div class="glance-sub">${bits.join(' · ')}</div>
    </div>
  </div>`;
}

function attentionHTML(items){
  if (!items.length) return `<div class="quiet">Nothing waiting right now.</div>`;
  return items.map(it=>{
    if (it.type==='promote'){
      const who = it.commits?.[0]?.by || '';
      const when = it.commits?.[0]?.at ? ago(it.commits[0].at) : '';
      const commits = (it.commits||[]).slice(0,3).map(c=>`<div class="summary-item">${esc(c.text)}</div>`).join('');
      const files = (it.files||[]).slice(0,8).map(f=>{
        const target = `${it.labRel}/${f.file}`;
        const sym = f.code==='A'?'+':f.code==='D'?'−':'~';
        return `<span class="fchip" data-reveal="${esc(target)}"><span class="op ${f.code}">${sym}</span>${esc(f.file)}</span>`;
      }).join('');
      const pSt = btnStateAttrs('promote:' + it.lab, 'Move to core');
      const rSt = btnStateAttrs('check:' + it.labRel + ':antigravity', 'Verify on bench');
      const oSt = btnStateAttrs('check:' + it.labRel + ':builder', 'Ask Builder');
      const lSt = btnStateAttrs('dismiss:' + it.lab, 'Later');
      return `<div class="card">
        <div class="card-top">
          <span class="dot green"></span>
          <span class="card-title">${esc(it.title)}</span>
          <span class="card-sub">${esc(it.labRel)} → ${esc(it.core)}</span>
          <span class="card-right">${who?`${esc(who)} · `:''}${when}</span>
        </div>
        ${it.proposal?`<div class="summary"><div class="summary-item"><b>${esc(it.proposal.by)} makes the case:</b> ${esc(it.proposal.why)}</div>${it.proposal.lived?`<div class="summary-item"><b>Lived in the lab:</b> ${esc(it.proposal.lived)}</div>`:''}${it.proposal.restarts?`<div class="summary-item"><b>Restarts:</b> ${esc(it.proposal.restarts)}</div>`:''}</div>`:''}
        ${commits?`<div class="summary">${commits}</div>`:''}
        ${files?`<div class="files">${files}</div>`:''}
        <div class="actions">
          <button class="btn primary${pSt.cls}"${pSt.dis} onclick="promote('${esc(it.lab)}', this)">${pSt.html}</button>
          <button class="btn${rSt.cls}"${rSt.dis} onclick="checkUpdate('${esc(it.labRel)}','${esc(it.title)}','antigravity', this)">${rSt.html}</button>
          <button class="btn${oSt.cls}"${oSt.dis} onclick="checkUpdate('${esc(it.labRel)}','${esc(it.title)}','builder', this)">${oSt.html}</button>
          <button class="btn ghost later-btn${lSt.cls}"${lSt.dis} style="margin-left:auto" onclick="dismissPromote('${esc(it.lab)}','${esc(it.head)}', this)">${lSt.html}</button>
        </div>
      </div>`;
    }
    if (it.type==='start-core'){
      const pSt = btnStateAttrs('promote:' + it.lab, 'Start core');
      const lSt = btnStateAttrs('dismiss:' + it.lab, 'Later');
      return `<div class="card">
        <div class="card-top">
          <span class="dot violet"></span>
          <span class="card-title">${esc(it.title)}</span>
          <span class="card-sub">${esc(it.labRel)} · lab only, no trusted copy yet</span>
          <span class="card-right">${it.at?ago(it.at):''}</span>
        </div>
        <div class="summary"><div class="summary-item">Start core makes the first trusted copy of this project. After that it changes only when you click Move to core.</div></div>
        <div class="actions">
          <button class="btn primary${pSt.cls}"${pSt.dis} onclick="promote('${esc(it.lab)}', this)">${pSt.html}</button>
          <button class="btn ghost later-btn${lSt.cls}"${lSt.dis} style="margin-left:auto" onclick="dismissPromote('${esc(it.lab)}','${esc(it.head)}', this)">${lSt.html}</button>
        </div>
      </div>`;
    }
    if (it.type==='flag'){
      const f = it.flag, a = f.agent, target = f.for || 'antigravity';
      const dotCls = a?.state==='answered' ? 'green' : a?.state==='working' ? 'sky' : a?.state==='failed' ? 'red' : 'amber';
      const statusTxt = a?.state==='working' ? `<span class="working">working</span>` : a?.state==='answered' ? `<span style="color:var(--green);font-size:12px">answered</span>` : a?.state==='failed' ? `<span style="color:var(--red);font-size:12px">stuck</span>` : '';
      const runSt = btnStateAttrs('route:' + f.id + ':antigravity', a ? 'Re-run check' : 'Run check');
      const builderSt = btnStateAttrs('route:' + f.id + ':builder', 'Hand to Builder');
      const doneSt = btnStateAttrs('done:' + f.id, 'Done');
      return `<div class="card">
        <div class="card-top">
          <span class="dot ${dotCls}"></span>
          <span class="card-title">${esc(f.tag)}</span>
          <span class="pclick" data-reveal="${esc(f.path)}">${esc(f.path || 'Foundry')}</span>
          <span class="route">${esc(cap(f.by))} → <span class="to-${esc(target)}">${esc(cap(target))}</span></span>
          <span class="card-right">${statusTxt}${ago(f.at)}</span>
        </div>
        ${f.note?`<div class="summary">${esc(f.note)}</div>`:''}
        ${a?.answer?`<div class="answer md">${md(a.answer)}</div>`:''}
        <div class="actions">
          ${state.board.agy && a?.state!=='working' ? `<button class="btn ${target==='antigravity'&&!a?'primary':''}${runSt.cls}"${runSt.dis} onclick="routeFlag('${esc(f.id)}','antigravity',true, this)">${runSt.html}</button>`:''}
          ${target!=='builder' ? `<button class="btn${builderSt.cls}"${builderSt.dis} onclick="routeFlag('${esc(f.id)}','builder',false, this)">${builderSt.html}</button>`:''}
          <button class="btn ghost${doneSt.cls}"${doneSt.dis} onclick="doneFlag('${esc(f.id)}', this)">${doneSt.html}</button>
          <button class="btn ghost later-btn" style="margin-left:auto" onclick="copyHandoff('${esc(f.id)}')">Copy</button>
        </div>
      </div>`;
    }
    if (it.type==='diverged') {
      const fSt = btnStateAttrs('qflag:' + it.labRel + ':antigravity', 'Flag for Breaker');
      const oSt = btnStateAttrs('qflag:' + it.labRel + ':builder', 'Hand to Builder');
      return `<div class="card warn-card">
        <div class="card-top"><span class="dot red"></span><span class="card-title">${esc(it.lab)}</span><span class="card-sub">lab and core split apart</span></div>
        <div class="actions">
          <button class="btn primary${fSt.cls}"${fSt.dis} onclick="quickFlag('${esc(it.labRel)}','Lab and core split apart — reconcile cleanly','Fix','antigravity',true, this)">${fSt.html}</button>
          <button class="btn${oSt.cls}"${oSt.dis} onclick="quickFlag('${esc(it.labRel)}','Lab and core split apart — reconcile cleanly','Fix','builder',false, this)">${oSt.html}</button>
        </div></div>`;
    }
    if (it.type==='core-edited') {
      const fSt = btnStateAttrs('qflag:' + it.rel + ':antigravity', 'Flag for Breaker');
      const oSt = btnStateAttrs('qflag:' + it.rel + ':builder', 'Hand to Builder');
      return `<div class="card warn-card">
        <div class="card-top"><span class="dot red"></span><span class="card-title">${esc(it.rel)}</span><span class="card-sub">${it.changes} hand edit(s) inside core</span></div>
        <div class="actions">
          <button class="btn primary${fSt.cls}"${fSt.dis} onclick="quickFlag('${esc(it.rel)}','Move hand edits from core into lab and restore core','Fix','antigravity',true, this)">${fSt.html}</button>
          <button class="btn${oSt.cls}"${oSt.dis} onclick="quickFlag('${esc(it.rel)}','Move hand edits from core into lab and restore core','Fix','builder',false, this)">${oSt.html}</button>
        </div></div>`;
    }
    return '';
  }).join('');
}

function blocksHTML(blocks){
  if (!blocks?.length) return '';
  return `<div class="sec">
    <div class="sec-h"><span class="sec-t">Blocked versions</span><span class="sec-n" style="color:var(--red);border-color:#54262a;background:#281416">${blocks.length}</span></div>
    ${blocks.map(b => `<div class="card warn-card">
      <div class="card-top">
        <span class="dot red"></span>
        <span class="card-title">${esc(b.name)}</span>
        <span class="card-sub">${esc((b.commit||'').slice(0,7))}</span>
        <span class="card-right">${ago(b.at)}</span>
      </div>
      ${b.why ? `<div class="summary">${esc(b.why)}</div>` : ''}
      ${b.files?.length ? `<div class="files">${b.files.map(f=>`<span class="fchip">${esc(f)}</span>`).join('')}</div>` : ''}
    </div>`).join('')}
  </div>`;
}

function standingsHTML(list, blocks = []){
  if (!list?.length) return '<div class="quiet">No projects yet.</div>';
  const blockedNames = new Set((blocks || []).map(b => b.name));
  return `<div class="standings">${list.map(s=>{
    const isBlocked = blockedNames.has(s.name) || (s.coreRel && blockedNames.has(s.coreRel.replace(/^core\//,'')));
    const dot = isBlocked || s.state==='core-edited'||s.state==='diverged' ? 'red' : s.state==='ahead' ? 'amber' : s.state==='same' ? 'green' : 'dim';
    const st = isBlocked ? `<span class="st-state err">blocked</span>`
      : s.state==='core-edited' ? `<span class="st-state err">edited core</span>`
      : s.state==='diverged' ? `<span class="st-state err">split</span>`
      : s.state==='ahead' ? `<span class="st-state ahead">+${s.ahead} ahead</span>`
      : s.state==='same' ? `<span class="st-state ok">in core</span>`
      : `<span class="st-state">lab</span>`;
    return `<div class="st-row" data-reveal="${esc(s.rel)}">
      <span class="dot ${dot}"></span>
      <span class="st-name">${esc(s.name)}</span>
      <span class="st-state-mob">${st}</span>
      <span class="st-msg">${esc(s.lastText || '—')}</span>
      <span class="st-meta">${st}<span>${s.lastBy?esc(s.lastBy.split(' ')[0])+' · ':''}${ago(s.lastAt)}</span>${s.changes ? `<span style="color:var(--sky)">${s.changes} unsaved</span>` : ''}</span>
    </div>`;
  }).join('')}</div>`;
}

function kindLabel(k){
  return ({ promote:'Moved', rollback:'Rolled back', flag:'Flag', 'flag-done':'Closed', backup:'Backup', 'backup-error':'Backup err', block:'Blocked', match:'Live Match', commit:'Saved', note:'Note', pin:'Pinned' })[k] || '';
}

function logHTML(list){
  if (!list?.length) return `<div class="quiet">Nothing recent.</div>`;
  return `<div class="log-list">${list.slice(0,35).map(a=>{
    const kl = kindLabel(a.kind);
    return `<div class="act">
      <div class="t">${ago(a.at)}</div>
      <div>
        <span class="who">${esc(a.by||'')}</span>
        ${kl ? `<span class="kind k-${esc(a.kind||'')}">${esc(kl)}</span>` : ''}
        <span class="txt">${esc(a.text)}</span>
        ${a.path ? `<span class="apath">${esc(a.path)}</span>` : ''}
      </div>
    </div>`;
  }).join('')}</div>`;
}

function fileViewHTML(){
  const f = state.focus;
  const pinned = state.board.pins.some(x=>x.path===f.path);
  const isMd = /\.md$/i.test(f.path);
  let body = '';
  if (f.text != null) {
    if (!f.text.trim()) body = `<div class="quiet">Empty file.</div>`;
    else if (isMd && !state.rawMode) body = `<div class="fv-md">${md(f.text)}</div>`;
    else body = `<pre>${esc(f.text)}</pre>`;
  } else if (f.image) body = `<img src="/api/raw?path=${encodeURIComponent(f.path)}">`;
  else if (f.binary) body = `<div class="quiet">Binary file.${!isPhone() ? ` <button class="tlink on" onclick="api('/api/open',{path:'${esc(f.path)}'})">Open in Explorer</button>` : ''}</div>`;
  else if (f.tooBig) body = `<div class="quiet">Large file.${!isPhone() ? ` <button class="tlink on" onclick="api('/api/open',{path:'${esc(f.path)}'})">Open in Explorer</button>` : ''}</div>`;

  const pinSt = btnStateAttrs('pin:' + f.path, pinned ? 'Unpin' : 'Pin focus');
  return `<div class="file-view">
    <div class="fv-top">
      <div class="fv-row1">
        ${repoHeaderHTML(f.path)}
        <button class="btn icon-close" style="margin-left:auto" onclick="select(null)" title="Back (Esc)">✕</button>
      </div>
      <div class="fv-actions">
        <button class="btn ghost" onclick="select(null)">← Back</button>
        <button class="btn${pinSt.cls}"${pinSt.dis} onclick="togglePin('${esc(f.path)}', this)">${pinSt.html}</button>
        ${state.flagging?'':`<button class="btn" onclick="state.flagging={for:'antigravity',tag:'Review',send:true};renderLeft();setTimeout(()=>$('#flagNote').focus(),20)">Flag</button>`}
        ${isMd ? `<button class="btn ghost" onclick="state.rawMode=!state.rawMode;renderLeft()">${state.rawMode?'Formatted':'Raw'}</button>` : ''}
        <button class="btn ghost desktop-only" onclick="api('/api/open',{path:'${esc(f.path)}'}).then(()=>toast('Opened in Explorer','ok'))">Explorer</button>
        <button class="btn ghost" onclick="copyPath('${esc(f.path)}')">Copy path</button>
      </div>
    </div>
    ${composerHTML()}
    <div class="fv-body">${body}</div>
  </div>`;
}

function usageSectionHTML(inCard = false){
  const pools = state.usage?.pools || [];
  if (!pools.length) return '';
  const rows = pools.map(p => {
    const [c1, c2, cg] = p.colors || ['#0f766e','#5eead4','rgba(94,234,212,0.35)'];
    const has = p.pct !== null && p.pct !== undefined;
    const isOpen = state.openPool === p.id;
    const tip = [p.label, has ? `${p.pct}% left` : 'not connected', p.note || ''].filter(Boolean).join(' · ');
    let det = '';
    if (isOpen) {
      const h5 = p.fiveHourPct !== null && p.fiveHourPct !== undefined;
      const hw = p.weekPct !== null && p.weekPct !== undefined;
      det = `<div class="u-det">
        <div class="u-cols">
          <div>
            <div class="u-col-top"><span class="u-lbl">5-Hour Left</span><span class="u-val ${h5?'':'na'}">${h5?p.fiveHourPct+'%':'n/a'}</span></div>
            ${barFillHTML(p.fiveHourPct, c1, c2, cg)}
            <div class="u-sub">${esc(p.fiveHourReset || (h5 ? '' : 'no reading'))}</div>
          </div>
          <div>
            <div class="u-col-top"><span class="u-lbl">Week Left</span><span class="u-val ${hw?'':'na'}">${hw?p.weekPct+'%':'n/a'}</span></div>
            ${barFillHTML(p.weekPct, c1, c2, cg)}
            <div class="u-sub">${esc(p.weekReset || (hw ? '' : 'no reading'))}</div>
          </div>
        </div>
        ${p.note ? `<div class="u-note"><span>${esc(p.note)}</span><span>${p.updatedAt ? ago(p.updatedAt) : ''}</span></div>` : ''}
      </div>`;
    }
    return `<div class="u-item">
      <div class="u-row ${has?'':'off'}" title="${esc(tip)}" onclick="state.openPool=state.openPool==='${esc(p.id)}'?null:'${esc(p.id)}';renderUsage();if(isPhone())renderLeft()">
        <span class="u-name">${esc(p.label)}</span>
        ${barFillHTML(p.pct, c1, c2, cg)}
        <span class="u-pct ${has?'':'na'}">${has ? p.pct + '%' : '—'}</span>
      </div>
      ${det}
    </div>`;
  }).join('');
  const refreshBtn = inCard
    ? `<button class="tlink" ${state.refreshingUsage?'disabled':''} onclick="refreshUsage()">${state.refreshingUsage?'Refreshing…':'↻ Refresh'}</button>`
    : `<button class="hb" style="margin-left:auto${state.refreshingUsage?';opacity:.45;pointer-events:none':''}" title="Refresh usage (on-click)" onclick="refreshUsage()">↻</button>
       <button class="hb" title="Edit usage-pools.json" onclick="api('/api/usage/open-config',{})">⚙</button>`;
  if (inCard) {
    return `<div class="sec">
      <div class="sec-h"><span class="sec-t">Usage pools</span><span class="sec-r">${refreshBtn}</span></div>
      <div class="usage-card"><div class="u-list">${rows}</div></div>
    </div>`;
  }
  return `<div class="u-head"><span>Usage</span>${refreshBtn}</div><div class="u-list">${rows}</div>`;
}

function renderLeft(force = false){
  const b = state.board; if (!b) return;
  const leftEl = $('#left');
  const mobile = isPhone();
  const activeMode = mobile ? state.tab : (state.sel ? 'desk' : state.deskView);
  const sameView = state.lastLeftSel === state.sel && state.lastTab === activeMode;
  const isHopperView = !(state.focus && !state.focus.dir) && ((mobile && !state.sel && state.tab === 'hopper') || (!mobile && !state.sel && state.deskView === 'hopper'));

  // Fast-path for Hopper view: NEVER recreate #hopperDropInput while staying on Hopper!
  // Only update #hopperBody (and skip even that if typing inside a running steer or check-in note box).
  if (sameView && isHopperView && $('#hopperBody')) {
    const ae = document.activeElement;
    if (!force && ((ae && (ae.classList?.contains('h-steer-in') || ae.classList?.contains('h-ci-note'))) || state.playbookEditing || (ae && ae.closest?.('#hPlaybookEditor')))) {
      state.deferRender = true;
      return;
    }
    state.deferRender = false;
    const bodyEl = $('#hopperBody');
    const keepSteers = new Map();
    bodyEl.querySelectorAll('.h-steer-in[data-steer-id]').forEach((el) => { if (el.value) keepSteers.set(el.dataset.steerId, el.value); });
    const keepCiNotes = new Map();
    bodyEl.querySelectorAll('.h-ci-note[data-ci-note]').forEach((el) => { if (el.dataset.dirty === '1') keepCiNotes.set(el.dataset.ciNote, el.value); });
    const nextBody = hopperBodyHTML();
    if (nextBody !== state.lastHopperBodyHTML) {
      state.lastHopperBodyHTML = nextBody;
      bodyEl.innerHTML = nextBody;
      for (const [sid, val] of keepSteers.entries()) {
        const el = bodyEl.querySelector(`.h-steer-in[data-steer-id="${CSS.escape(sid)}"]`);
        if (el) { el.value = val; autoGrow(el, 160); }
      }
      for (const [cid, val] of keepCiNotes.entries()) {
        const el = bodyEl.querySelector(`.h-ci-note[data-ci-note="${CSS.escape(cid)}"]`);
        if (el) { el.value = val; el.dataset.dirty = '1'; autoGrow(el, 140); }
      }
      wireHopperSteers(bodyEl);
    }
    const cntEl = document.querySelector('.desk-sw-cnt');
    const benchN = state.hopper?.bench?.length || 0;
    if (cntEl) cntEl.textContent = String(benchN);
    return;
  }

  state.deferRender = false;
  const keepLeftScroll = sameView ? leftEl.scrollTop : 0;
  const keepPreviewScroll = sameView ? ($('.preview')?.scrollTop || 0) : 0;
  const keepNote = $('#flagNote')?.value;
  const keepQuickNote = $('#quickNoteInput')?.value;
  const keepHopperDrop = $('#hopperDropInput')?.value;
  const keepSteers = new Map();
  document.querySelectorAll('.h-steer-in[data-steer-id]').forEach((el) => { if (el.value) keepSteers.set(el.dataset.steerId, el.value); });

  let nextHTML = '';
  if (state.focus && !state.focus.dir) {
    nextHTML = fileViewHTML();
  } else if (mobile && !state.sel) {
    if (state.tab === 'hopper') {
      nextHTML = hopperViewHTML();
    } else if (state.tab === 'needs') {
      nextHTML = `
        ${glanceHeroHTML(b)}
        <div class="sec">
          <div class="sec-h">
            <span class="sec-t">Needs you</span>
            ${b.attention.length ? `<span class="sec-n hot">${b.attention.length}</span>` : `<span class="sec-n ok">0</span>`}
          </div>
          ${attentionHTML(b.attention)}
        </div>
        ${blocksHTML(b.blocks)}
        ${b.pins.length ? `<div class="sec">
          <div class="sec-h"><span class="sec-t">Current focus</span><span class="sec-n">${b.pins.length}</span></div>
          <div class="focus-bar">${b.pins.map(p=>`<div class="pin-chip" data-reveal="${esc(p.path)}"><span class="dot violet"></span><span class="pn">${esc(p.path)}</span><button class="px" onclick="event.stopPropagation();togglePin('${esc(p.path)}')">×</button></div>`).join('')}</div>
        </div>` : ''}
      `;
    } else if (state.tab === 'progress') {
      const st = b.standings || [];
      const synced = st.filter(s => s.state === 'same').length;
      const ready = st.filter(s => s.state === 'ahead').length;
      const blocked = (b.blocks || []).length;
      nextHTML = `
        <div class="sec">
          <div class="sec-h"><span class="sec-t">Progress</span><span class="sec-n">${st.length}</span></div>
          <div class="prog-pills">
            <span class="ppill"><span class="dot green"></span>${synced} in core</span>
            ${ready ? `<span class="ppill"><span class="dot amber"></span>${ready} ready</span>` : ''}
            ${blocked ? `<span class="ppill"><span class="dot red"></span>${blocked} blocked</span>` : ''}
          </div>
          ${standingsHTML(st, b.blocks)}
        </div>
        ${blocksHTML(b.blocks)}
        ${usageSectionHTML(true)}
      `;
    } else if (state.tab === 'activity') {
      const nSt = btnStateAttrs('quickNote', 'Post');
      nextHTML = `
        <div class="sec">
          <div class="sec-h"><span class="sec-t">Activity</span><span class="sec-r"><button class="tlink" onclick="copyContext()">Copy context</button></span></div>
          <div class="note-box">
            <input id="quickNoteInput" type="text" placeholder="Drop a quick note on the board…">
            <button class="btn primary${nSt.cls}"${nSt.dis} style="min-width:86px;white-space:nowrap;flex:none" onclick="postQuickNote(this)">${nSt.html}</button>
          </div>
          ${logHTML(b.activity)}
        </div>
      `;
    }
  } else if (!mobile && !state.sel && state.deskView === 'hopper') {
    nextHTML = `${deskSwitchHTML()}${hopperViewHTML()}`;
  } else {
    const att = state.sel ? b.attention.filter(it => { const p = it.flag?.path ?? it.labRel ?? it.rel; return !p || p.startsWith(state.sel) || state.sel.startsWith(p); }) : b.attention;
    nextHTML = `
      ${!mobile && !state.sel ? deskSwitchHTML() : ''}
      ${inspectorHTML()}
      <div class="sec">
        <div class="sec-h">
          <span class="sec-t">Needs you</span>
          ${att.length?`<span class="sec-n hot">${att.length}</span>`:''}
          <span class="sec-r">${state.sel && att.length!==b.attention.length?`<button class="tlink" onclick="select(null)">Show all (${b.attention.length})</button>`:''}</span>
        </div>
        ${attentionHTML(att)}
      </div>
      ${state.sel ? '' : blocksHTML(b.blocks)}
      <div class="sec">
        <div class="sec-h">
          <span class="sec-t">Current focus</span>
          ${b.pins.length?`<span class="sec-n">${b.pins.length}</span>`:`<span class="quiet" style="padding:0">None</span>`}
          <span class="sec-r"><button class="tlink" onclick="copyContext()">Copy for agent</button></span>
        </div>
        ${b.pins.length?`<div class="focus-bar">${b.pins.map(p=>`<div class="pin-chip" data-reveal="${esc(p.path)}"><span class="dot violet"></span><span class="pn">${esc(p.path)}</span><button class="px" onclick="event.stopPropagation();togglePin('${esc(p.path)}')">×</button></div>`).join('')}</div>`:''}
      </div>
      ${state.sel ? '' : `<div class="sec">
        <div class="sec-h">
          <span class="sec-t">Projects</span>
          <span class="sec-r"><button class="tlink ${state.showLog?'on':''}" onclick="state.showLog=!state.showLog;loadBoard().then(renderLeft)">${state.showLog?'Hide log':'Log'}</button></span>
        </div>
        ${standingsHTML(b.standings, b.blocks)}
      </div>`}
      ${(state.showLog || state.sel) && b.activity?.length ? `<div class="sec"><div class="sec-h"><span class="sec-t">${state.sel?'History':'Recent log'}</span></div>${logHTML(b.activity)}</div>` : ''}
    `;
  }

  if (nextHTML === state.lastLeftHTML && sameView) return;
  state.lastLeftHTML = nextHTML;
  state.lastHopperBodyHTML = isHopperView ? hopperBodyHTML() : '';
  state.lastLeftSel = state.sel;
  state.lastTab = activeMode;
  leftEl.innerHTML = nextHTML;
  if (sameView) {
    leftEl.scrollTop = keepLeftScroll;
    const prev = $('.preview');
    if (prev && keepPreviewScroll) prev.scrollTop = keepPreviewScroll;
  } else {
    leftEl.scrollTop = 0;
  }
  if (keepNote && $('#flagNote')) $('#flagNote').value = keepNote;
  if (keepQuickNote && $('#quickNoteInput')) $('#quickNoteInput').value = keepQuickNote;
  if (keepHopperDrop && $('#hopperDropInput')) { $('#hopperDropInput').value = keepHopperDrop; autoGrow($('#hopperDropInput'), 220); }
  for (const [sid, val] of keepSteers.entries()) {
    const el = document.querySelector(`.h-steer-in[data-steer-id="${CSS.escape(sid)}"]`);
    if (el) { el.value = val; autoGrow(el, 160); }
  }
  $('#flagNote')?.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); submitFlag(); } if (e.key==='Escape'){ state.flagging=null; renderLeft(true); } });
  $('#quickNoteInput')?.addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); postQuickNote(); } });
  const hDrop = $('#hopperDropInput');
  if (hDrop) {
    hDrop.addEventListener('input', () => autoGrow(hDrop, 220));

function wireHopperSteers(root){
  root.querySelectorAll('.h-steer-in[data-steer-id]').forEach((el) => {

    el.addEventListener('input', () => { el.dataset.dirty = '1'; autoGrow(el, 140); });

      if (!isPhone() && e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        el.blur();
      }
    });
    autoGrow(el, 140);
  });
}

// ---------- live ----------
let refreshing = false, again = false;
async function refreshAll(){
  if (refreshing){ again = true; return; }
  refreshing = true;
  try{
    // Update the visible board & focus FIRST so taps reflect on screen right away; refresh tree & usage in parallel.
    const focusP = state.sel ? get('/api/focus?path='+encodeURIComponent(state.sel)).catch(()=>null) : Promise.resolve(null);
    const boardP = loadBoard();
    const hopperP = loadHopper();
    const bgP = Promise.all([refreshTree(), loadUsage()]);
    if (state.sel) {
      state.focus = await focusP;
      if (!state.focus){ state.sel=null; localStorage.removeItem('sel'); syncBodyClasses(); }
    }
    await Promise.all([boardP, hopperP]);
    renderLeft();
    await bgP;
    if (isPhone() && state.tab === 'progress') renderLeft();
  } finally { refreshing=false; if (again){ again=false; refreshAll(); } }
}
// The window keeps itself current (Nov 24, his ask: "I really would love the foundry window to update").
// A new server (after a Move to core restarts it) reloads the page onto the new code; a line that dropped catches up
// as soon as it's back; and the board refreshes whenever he looks at the window, and once a minute regardless.
let bootSeen = null, lostLine = false;
function connect(){
  const es = new EventSource('/api/events');
  es.onopen = () => { setLiveBadge(true); if (lostLine) { lostLine = false; refreshAll(); } };
  es.onmessage = (e) => {
    setLiveBadge(true);
    const m = /^hello (\S+)/.exec(e.data || '');
    if (m) {
      if (bootSeen && bootSeen !== m[1]) { location.reload(); return; }
      bootSeen = m[1];
    }
    refreshAll();
  };
  es.onerror = () => { setLiveBadge(false); lostLine = true; };
}
let lastLook = 0;
function freshOnLook(){ if (document.hidden) return; const t = Date.now(); if (t - lastLook < 3000) return; lastLook = t; refreshAll(); }
document.addEventListener('visibilitychange', freshOnLook);
addEventListener('focus', freshOnLook);
setInterval(() => { if (!document.hidden) refreshAll(); }, 60000);

(() => {
  const saved = localStorage.getItem('treeW'); if (saved) document.documentElement.style.setProperty('--treeW', saved);
  let drag = false;
  $('#grip').addEventListener('mousedown', ()=>{ drag=true; document.body.style.cursor='col-resize'; });
  addEventListener('mouseup', ()=>{ if(drag){ drag=false; document.body.style.cursor=''; localStorage.setItem('treeW', getComputedStyle(document.documentElement).getPropertyValue('--treeW')); } });
  addEventListener('mousemove', e=>{ if(!drag) return; const w = Math.min(Math.max(innerWidth - e.clientX, 260), innerWidth-440); document.documentElement.style.setProperty('--treeW', w+'px'); });
})();

window.matchMedia('(max-width: 860px)').addEventListener('change', () => {
  loadBoard().then(() => renderLeft(true));
});
$('#confirmModal').addEventListener('click', e => { if (e.target.id === 'confirmModal') closeConfirm(); });
$('#hopperModal').addEventListener('click', e => { if (e.target.id === 'hopperModal') closeHopperModal(); });
$('#hopperLightbox').addEventListener('click', e => { if (e.target.id === 'hopperLightbox') closeHopperLightbox(); });
addEventListener('keydown', e => {
  if (e.key==='Escape') {
    if ($('#hopperLightbox').classList.contains('open')) { closeHopperLightbox(); return; }
    if ($('#hopperModal').classList.contains('open')) { closeHopperModal(); return; }
    if ($('#confirmModal').classList.contains('open')) { closeConfirm(); return; }
    if (state.sel && document.activeElement?.tagName!=='TEXTAREA') select(null);
  }
});

(async () => {
  syncBodyClasses();
  $('#left').innerHTML = `<div class="glance"><div class="glance-ico"><span class="spin"></span></div><div class="glance-body"><div class="glance-title">Loading Foundry…</div><div class="glance-sub">Checking what needs you</div></div></div>`;
  const boardTask = state.sel ? select(state.sel) : loadBoard().then(renderLeft);
  await Promise.all([boardTask, loadHopper(), refreshTree(), loadUsage()]);
  renderLeft();
  connect();
  setInterval(loadUsage, 30000);
  setInterval(() => {
    const ct = state.hopper?.caretaker || state.hopper?.watcher || {};
    if (ct.armed || (ct.activeRuns && Object.keys(ct.activeRuns).length > 0)) {
      loadHopper().then(() => renderLeft());
    }
  }, 15000);
})();
</script>
</body>
</html>
