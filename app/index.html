<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Foundry</title>
<style>
  :root{
    --bg:#09090b; --rail:#0e0e12; --card:#131318; --card2:#191920; --hover:#1d1d25; --sel:#23232d;
    --line:#22222a; --line2:#30303b;
    --text:#f0f0f4; --text2:#b8b8c4; --muted:#7f7f8f; --dim:#575764;
    --green:#5ec48e; --amber:#e5a956; --violet:#a78bfa; --sky:#74b3f0; --red:#eb7373;
    --treeW: 390px;
    --navH: 64px;
    --topH: 54px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  button{font:inherit;color:inherit;touch-action:manipulation}
  ::selection{background:#2d2d3b}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#24242b;border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:#32323c}
  ::-webkit-scrollbar-track{background:transparent}

  /* MOBILE CHROME (hidden on desktop) */
  .m-bar,.m-nav{display:none}

  .app{display:grid;grid-template-columns:minmax(0,1fr) 1px var(--treeW);height:100vh;height:100dvh}
  .grip{cursor:col-resize;background:var(--line);position:relative}
  .grip::after{content:'';position:absolute;inset:0 -3px}
  .grip:hover{background:#3f3f4a}

  /* LEFT PANE */
  .left{overflow:auto;padding:28px 34px 72px;max-width:980px;-webkit-overflow-scrolling:touch}
  .sec{margin:0 0 30px}
  .sec-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
  .sec-t{font-size:13.5px;font-weight:600;color:var(--text);letter-spacing:.1px}
  .sec-n{font-size:12px;color:var(--muted);background:#18181e;border:1px solid var(--line2);border-radius:10px;padding:1px 8px;font-weight:600;font-variant-numeric:tabular-nums}
  .sec-n.hot{background:#2b2112;border-color:#5a4320;color:var(--amber)}
  .sec-n.ok{background:#12251c;border-color:#264f3c;color:var(--green)}
  .sec-r{margin-left:auto;display:flex;gap:8px;align-items:center}
  .tlink{border:1px solid var(--line2);background:#16161b;color:var(--text2);cursor:pointer;font-size:12px;padding:5px 11px;border-radius:7px;transition:background .12s,border-color .12s,color .12s,transform .08s}
  .tlink:hover{background:#202028;border-color:#3d3d4a;color:#ffffff}
  .tlink:active{transform:scale(.97)}
  .tlink.on{background:#24242e;border-color:#454554;color:#ffffff}
  .quiet{color:var(--dim);font-size:13.5px;padding:4px 0}

  /* GLANCE STATUS HERO (visible on phone Needs tab; compact on desktop when all clear) */
  .glance{background:linear-gradient(180deg,#14161c 0%,#101116 100%);border:1px solid var(--line2);border-radius:14px;padding:16px 18px;margin-bottom:18px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 26px rgba(0,0,0,.35)}
  .glance.clear{border-color:#1f3d2f;background:linear-gradient(180deg,#111916 0%,#0d1210 100%)}
  .glance.needs{border-color:#4d3a1c;background:linear-gradient(180deg,#1b160f 0%,#13100c 100%)}
  .glance-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;font-size:17px;font-weight:700}
  .glance.clear .glance-ico{background:#163024;color:var(--green);border:1px solid #27543f}
  .glance.needs .glance-ico{background:#2f2311;color:var(--amber);border:1px solid #5c441e}
  .glance-body{min-width:0;flex:1}
  .glance-title{font-size:16px;font-weight:650;color:#ffffff;letter-spacing:-.15px;line-height:1.25}
  .glance-sub{font-size:13px;color:var(--text2);margin-top:3px;line-height:1.4}
  .glance-links{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}

  /* CARDS — dark obsidian layers */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;transition:border-color .15s,background .15s,opacity .25s}
  .card.handled{opacity:.35;pointer-events:none}
  .card:hover{border-color:var(--line2)}
  .card.warn-card{border-color:#442628;background:#161012}
  .card-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .dot.green{background:var(--green)} .dot.amber{background:var(--amber)} .dot.red{background:var(--red)} .dot.violet{background:var(--violet)} .dot.sky{background:var(--sky)} .dot.dim{background:var(--dim)}
  .card-title{font-size:15px;font-weight:600;color:var(--text)}
  .card-sub{font-size:12.5px;color:var(--muted)}
  .card-right{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .route{font-size:12px;color:var(--text2);background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
  .route .to-builder{color:var(--green)} .route .to-antigravity,.route .to-breaker{color:var(--sky)} .route .to-lead{color:var(--violet)} .route .to-you{color:var(--amber)}

  .summary{margin:10px 0 0;color:var(--text2);font-size:13.5px;line-height:1.55;word-break:break-word}
  .summary-item{margin:4px 0}
  .files{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .fchip{font-family:"Cascadia Code",Consolas,monospace;font-size:11.5px;color:var(--muted);background:#0d0d11;border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fchip:hover{color:var(--text);border-color:var(--line2)}
  .fchip .op{margin-right:4px;font-weight:600}
  .fchip .op.A{color:var(--green)} .fchip .op.M{color:var(--amber)} .fchip .op.D{color:var(--red)}

  .answer{margin-top:12px;background:#0e0e13;border:1px solid var(--line);border-radius:9px;padding:12px 14px;font-size:13.5px;color:var(--text2)}
  .working{color:var(--sky);font-size:12px}
  .working::after{content:'';display:inline-block;width:6px;height:6px;margin-left:6px;border-radius:50%;background:var(--sky);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.2}}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* BUTTONS WITH VISIBLE TAP / BUSY / DONE STATES */
  .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
  .btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#1a1a22;border:1px solid #2e2e3a;border-radius:8px;padding:6px 13px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text);transition:background .12s,border-color .12s,color .12s,transform .08s,box-shadow .12s;user-select:none}
  .btn:hover:not(:disabled){background:#252530;border-color:#444454}
  .btn:active:not(:disabled){transform:scale(.97);background:#2b2b38}
  .btn.primary{background:#17392b;border-color:#2f8560;color:#c9f2dc;font-weight:650}
  .btn.primary:hover:not(:disabled){background:#1e4836;border-color:#3a9d73}
  .btn.primary:active:not(:disabled){background:#123023;transform:scale(.97)}
  .btn.ghost{background:#14141a;border-color:#262630;color:var(--text2)}
  .btn.ghost:hover:not(:disabled){color:#ffffff;background:#1f1f28;border-color:#3a3a48}
  .btn.icon-close{background:#16161c;border:1px solid var(--line);color:var(--muted);width:32px;height:32px;padding:0;border-radius:8px}
  .btn.icon-close:hover{background:#23232c;border-color:var(--line2);color:#ffffff}
  .btn.danger{color:#f59898;border-color:#4a2528;background:#201214;font-weight:600}
  .btn.danger:hover:not(:disabled){background:#2d171a;border-color:#683338;color:#ffb4b4}
  .btn.danger-solid{background:#b9383c;border-color:#d44b4f;color:#ffffff;font-weight:650}
  .btn.danger-solid:hover:not(:disabled){background:#cf4044}
  .btn:disabled{opacity:.65;cursor:default}
  .btn.is-busy{border-color:#3e587c;background:#152030;color:#b8d7ff}
  .btn.primary.is-busy{background:#152030;color:#b8d7ff;border-color:#3e587c}
  .btn.is-done{border-color:#2b6649 !important;background:#132b20 !important;color:#8ee6b6 !important}
  .btn.is-err{border-color:#723034 !important;background:#2a1416 !important;color:#ffb4b4 !important}
  .spin{width:13px;height:13px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;flex:none}

  /* ISOLATED ROLL BACK DANGER ZONE (prevents slipped-thumb taps) */
  .danger-zone{margin-top:24px;padding:15px 16px;border-radius:11px;border:1px solid #3c2225;background:#140d0f;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .dz-text{min-width:0;flex:1}
  .dz-title{font-size:13px;font-weight:600;color:#f0a2a2}
  .dz-sub{font-size:12px;color:var(--muted);margin-top:2px}

  .pclick{font-family:"Cascadia Code",Consolas,monospace;font-size:12px;color:var(--text2);cursor:pointer;border-bottom:1px dotted #3a3a45;word-break:break-all}
  .pclick:hover{color:var(--text);border-bottom-color:var(--text)}

  /* CURRENT FOCUS */
  .focus-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pin-chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 9px 7px 12px;cursor:pointer;font-size:13px;max-width:100%}
  .pin-chip:hover{border-color:var(--line2);background:var(--card2)}
  .pin-chip .pn{font-family:"Cascadia Code",Consolas,monospace;font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pin-chip .px{border:0;background:transparent;color:var(--dim);cursor:pointer;border-radius:5px;width:22px;height:22px;line-height:20px;flex:none}
  .pin-chip .px:hover{background:#26262f;color:var(--text)}

  /* PROJECTS (FOOTING / PROGRESS) */
  .standings{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .st-row{display:grid;grid-template-columns:14px 150px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
  .st-row:last-child{border-bottom:0}
  .st-row:hover{background:var(--card2)}
  .st-row:active{background:var(--sel)}
  .st-name{font-weight:600;font-size:13.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st-msg{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st-meta{font-size:12px;color:var(--dim);white-space:nowrap;display:flex;align-items:center;gap:10px}
  .st-state{font-size:11.5px;font-weight:600;color:var(--text2);background:#1b1b22;border:1px solid var(--line2);padding:2px 8px;border-radius:999px}
  .st-state.ok{color:var(--green);background:#11231a;border-color:#224735}
  .st-state.ahead{color:var(--amber);background:#261d10;border-color:#4f3b1d}
  .st-state.err{color:var(--red);background:#281416;border-color:#54262a}

  /* PROGRESS SUMMARY STRIP */
  .prog-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .ppill{font-size:12px;color:var(--text2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 11px;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}

  /* REPO-STYLE PATH HEADER */
  .repo-hdr{display:flex;flex-direction:column;gap:4px;min-width:0}
  .crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-family:"Cascadia Code",Consolas,monospace;font-size:11.5px;color:var(--muted)}
  .crumb-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px 5px;border-radius:5px;font:inherit}
  .crumb-btn:hover{background:#202028;color:var(--text)}
  .crumb-sep{color:var(--dim)}
  .repo-title-row{display:flex;align-items:center;gap:10px}
  .repo-title{font-size:19px;font-weight:650;color:#ffffff;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* INSPECTOR */
  .inspector{background:var(--card);border:1px solid var(--line2);border-radius:13px;padding:18px 20px;margin-bottom:24px}
  .ins-head{display:flex;align-items:flex-start;gap:12px}
  .ins-stat{margin-top:8px;font-size:13px;color:var(--text2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .preview{margin-top:14px;max-height:460px;overflow:auto;background:#0b0b0e;border:1px solid var(--line);border-radius:9px;padding:14px 16px}
  .preview pre{margin:0;font:12.5px/1.55 "Cascadia Code",Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:#c9c9d2}
  .preview img{max-width:100%;border-radius:6px}
  .md h1,.md h2,.md h3{font-size:14.5px;color:var(--text);margin:12px 0 6px}
  .md p{margin:6px 0} .md ul{margin:6px 0;padding-left:20px}
  .md code{font-family:"Cascadia Code",Consolas,monospace;font-size:12px;background:#1a1a21;padding:1px 5px;border-radius:4px}
  .md pre code{display:block;padding:10px;white-space:pre-wrap}
  .md a{color:var(--sky)}

  /* FULL-PANE FILE VIEW */
  .file-view{display:flex;flex-direction:column;min-height:calc(100vh - 56px)}
  .fv-top{padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:18px;display:flex;flex-direction:column;gap:12px}
  .fv-row1{display:flex;align-items:flex-start;gap:12px}
  .fv-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .fv-body{flex:1;font-size:14.5px;line-height:1.68;color:#d6d6de}
  .fv-body pre{margin:0;font:13px/1.6 "Cascadia Code",Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:#d2d2dc;background:#0e0e11;border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .fv-body img{max-width:100%;border-radius:8px;border:1px solid var(--line)}
  .fv-md{max-width:760px}
  .fv-md h1{font-size:21px;font-weight:600;color:#ffffff;margin:0 0 14px;letter-spacing:-.2px}
  .fv-md h2{font-size:16.5px;font-weight:600;color:var(--text);margin:22px 0 8px}
  .fv-md h3{font-size:14.5px;font-weight:600;color:var(--text2);margin:16px 0 6px}
  .fv-md p{margin:10px 0}
  .fv-md ul,.fv-md ol{margin:10px 0;padding-left:22px}
  .fv-md li{margin:4px 0}
  .fv-md blockquote{margin:12px 0;padding:4px 14px;border-left:2px solid #383844;color:var(--muted)}
  .fv-md hr{border:0;border-top:1px solid var(--line);margin:20px 0}
  .fv-md code{font-family:"Cascadia Code",Consolas,monospace;font-size:12.5px;background:#18181f;padding:2px 6px;border-radius:4px;color:#e2e2ea}
  .fv-md pre{margin:12px 0}
  .fv-md pre code{background:transparent;padding:0;font-size:12.5px}
  .fv-md a{color:var(--sky);text-decoration:none} .fv-md a:hover{text-decoration:underline}

  /* FLAG / NOTE COMPOSER */
  .composer{margin-top:14px;background:#0e0e13;border:1px solid var(--line2);border-radius:11px;padding:14px}
  .composer textarea,.note-box input{width:100%;background:#14141a;color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font:inherit;outline:none}
  .composer textarea{min-height:68px;resize:vertical}
  .composer textarea:focus,.note-box input:focus{border-color:#536685}
  .crow{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
  .clbl{font-size:11.5px;color:var(--dim);margin-right:4px}
  .seg{border:1px solid var(--line2);background:#14141a;border-radius:7px;padding:5px 11px;cursor:pointer;font-size:12.5px;color:var(--muted)}
  .seg:hover{color:var(--text);border-color:#444452}
  .seg.on{background:#2a2a35;color:#f0f0f4;border-color:#55556a;font-weight:600}
  .note-box{display:flex;gap:8px;margin-bottom:14px}

  /* ACTIVITY LOG */
  .log-list{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 16px}
  .act{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #1b1b22;font-size:13.5px;align-items:baseline}
  .act:last-child{border-bottom:0}
  .act .t{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}
  .act .who{font-weight:600;color:var(--text);margin-right:6px;font-size:12.5px}
  .act .kind{display:inline-block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.35px;padding:1px 6px;border-radius:4px;margin-right:6px;background:#1c1c24;color:var(--muted);border:1px solid var(--line)}
  .act .kind.k-promote{color:var(--green);background:#11231a;border-color:#224735}
  .act .kind.k-rollback,.act .kind.k-backup-error,.act .kind.k-block{color:var(--red);background:#281416;border-color:#54262a}
  .act .kind.k-flag{color:var(--amber);background:#261d10;border-color:#4f3b1d}
  .act .kind.k-match{color:var(--sky);background:#122030;border-color:#254363}
  .act .txt{color:var(--text2);line-height:1.45;word-break:break-word}
  .act .apath{display:block;margin-top:3px;font-family:"Cascadia Code",Consolas,monospace;font-size:11px;color:var(--dim)}

  /* RIGHT PANE: USAGE + FOLDER TREE */
  .right{background:var(--rail);overflow:auto;padding:14px 0 40px;-webkit-overflow-scrolling:touch}
  .rhead{padding:0 14px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #18181d;margin-bottom:8px}
  .rhead b{font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.2px}
  .dock-pill{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:11.5px;font-weight:650;color:#efe6ff;background:linear-gradient(135deg,rgba(168,130,255,.2),rgba(244,114,182,.12));border:1px solid rgba(168,130,255,.44);border-radius:999px;padding:3px 10px;box-shadow:0 0 14px rgba(168,130,255,.16);transition:background .12s,border-color .12s,box-shadow .12s,transform .08s;white-space:nowrap}
  .dock-pill:hover{background:linear-gradient(135deg,rgba(168,130,255,.28),rgba(244,114,182,.18));border-color:rgba(201,178,255,.65);box-shadow:0 0 18px rgba(168,130,255,.26);color:#fff}
  .dock-pill:active{transform:scale(.96)}

  .usage-box{padding:4px 14px 12px;border-bottom:1px solid #18181d;margin-bottom:8px}
  .usage-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .u-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .u-head span{font-size:11px;font-weight:600;letter-spacing:.45px;text-transform:uppercase;color:var(--dim)}
  .u-list{display:flex;flex-direction:column;gap:5px}
  .u-item{border-radius:8px;transition:background .12s}
  .u-row{display:grid;grid-template-columns:112px 1fr 38px;align-items:center;gap:10px;padding:6px 6px;border-radius:8px;cursor:pointer;user-select:none}
  .u-row:hover{background:var(--hover)}
  .u-name{font-size:12.5px;font-weight:500;color:#d6d6de;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .u-row.off .u-name{color:var(--muted)}
  .u-track{height:7px;border-radius:999px;background:#191921;overflow:hidden;position:relative;box-shadow:inset 0 1px 2px #0006}
  .u-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .35s ease}
  .u-fill.glow{box-shadow:0 0 8px var(--cg)}
  .u-fill.dim{opacity:.28}
  .u-pct{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;color:var(--text)}
  .u-pct.na{color:var(--dim);font-weight:500}
  .u-det{padding:8px 10px 9px;margin:2px 2px 6px;background:#101015;border:1px solid #1f1f29;border-radius:8px;display:flex;flex-direction:column;gap:8px}
  .u-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .u-col-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
  .u-lbl{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
  .u-val{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
  .u-val.na{color:var(--dim);font-weight:500;font-size:11.5px}
  .u-sub{font-size:10.5px;color:var(--dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .u-note{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

  .preview-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #18181f}
  .tree{user-select:none}
  .node{display:flex;align-items:center;height:30px;padding-right:10px;cursor:pointer;position:relative;white-space:nowrap}
  .node:hover{background:var(--hover)}
  .node.sel{background:var(--sel)}
  .node .chev{width:18px;flex:none;color:var(--dim);font-size:9px;text-align:center;transition:transform .12s}
  .node .chev.open{transform:rotate(90deg)}
  .node .ico{width:20px;flex:none;display:flex;align-items:center}
  .node .name{overflow:hidden;text-overflow:ellipsis;font-size:13.5px;color:#d6d6de}
  .node.sel .name{color:#ffffff}
  .node .badges{margin-left:auto;display:flex;gap:6px;align-items:center;padding-left:8px;flex:none}
  .ind{font-size:11px;color:var(--muted)}
  .ind.up{color:var(--green)} .ind.chg{color:var(--sky)} .ind.flag{color:var(--amber);font-weight:600} .ind.pin{color:var(--violet)} .ind.split{color:var(--red)}
  .node .hov{display:none;gap:2px;margin-left:4px}
  .node:hover .hov{display:flex}
  .node:hover .badges .hide-hov{display:none}
  .hb{border:0;background:transparent;color:var(--muted);border-radius:6px;width:26px;height:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
  .hb:hover{background:#2b2b34;color:var(--text)}
  .guide{position:absolute;top:0;bottom:0;border-left:1px solid #1b1b21}

  /* HIGH-VISIBILITY FEEDBACK TOAST */
  .toast{position:fixed;left:28px;bottom:22px;z-index:80;background:#171820;border:1px solid var(--line2);border-radius:11px;padding:11px 16px;max-width:480px;font-size:13.5px;font-weight:500;color:#f2f2f6;box-shadow:0 14px 36px rgba(0,0,0,.65);display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(10px) scale(.98);transition:opacity .16s ease,transform .16s ease;pointer-events:none}
  .toast.show{opacity:1;transform:none;pointer-events:auto;cursor:pointer}
  .toast .tico{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;background:#232430;color:var(--sky)}
  .toast.ok{border-color:#2c664a;background:#11221a;color:#d6fae6}
  .toast.ok .tico{background:#1d4a34;color:#7ef0b2}
  .toast.err{border-color:#6d2d31;background:#261315;color:#ffd0d0}
  .toast.err .tico{background:#4d1e22;color:#ff8a8a}

  /* DARK CONFIRMATION SHEET (for safe Roll back) */
  .modal-back{position:fixed;inset:0;z-index:90;background:rgba(4,4,7,.76);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
  .modal-back.open{display:flex}
  .modal-card{width:100%;max-width:420px;background:#131319;border:1px solid #3c262a;border-radius:16px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.75)}
  .modal-kicker{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--red);margin-bottom:6px}
  .modal-title{font-size:18px;font-weight:650;color:#ffffff;margin:0 0 8px}
  .modal-body{font-size:14px;color:var(--text2);line-height:1.55;margin:0 0 22px}
  .modal-actions{display:flex;gap:14px;justify-content:flex-end}

  /* ===================== PHONE LAYOUT (Galaxy S24 Ultra ~412px, <= 860px) ===================== */
  @media (max-width: 860px){
    html,body{font-size:15px}
    .desktop-only{display:none !important}

    .m-bar{
      display:flex;align-items:center;gap:10px;
      position:fixed;top:0;left:0;right:0;z-index:50;
      height:calc(var(--topH) + env(safe-area-inset-top));
      padding:env(safe-area-inset-top) 14px 0;
      background:rgba(9,9,11,.94);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }
    .m-brand{font-size:16px;font-weight:700;letter-spacing:-.2px;color:#ffffff;display:flex;align-items:center;gap:8px}
    .m-live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--green);background:#102219;border:1px solid #214534;border-radius:999px;padding:2px 9px}
    .m-live.off{color:var(--amber);background:#261d10;border-color:#523e1d}
    .m-live::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
    .m-bar-r{margin-left:auto;display:flex;align-items:center;gap:6px}
    .m-bar-r .dock-pill{min-height:38px;padding:0 12px;font-size:12.5px}
    .m-icon-btn{min-width:42px;height:42px;padding:0 11px;border-radius:10px;border:1px solid var(--line2);background:#14141a;color:var(--text2);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer}
    .m-icon-btn:active{transform:scale(.95);background:#22222c;color:#ffffff}

    .app{display:block;height:100dvh}
    .grip{display:none}
    .left{
      max-width:none;height:100dvh;
      padding:calc(var(--topH) + env(safe-area-inset-top) + 14px) 14px calc(var(--navH) + env(safe-area-inset-bottom) + 28px);
    }
    .right{
      display:none;height:100dvh;background:var(--bg);
      padding:calc(var(--topH) + env(safe-area-inset-top) + 10px) 10px calc(var(--navH) + env(safe-area-inset-bottom) + 28px);
    }
    body.tab-files:not(.has-sel) .left{display:none}
    body.tab-files:not(.has-sel) .right{display:block}
    .right .rhead,.right .usage-box{display:none}

    .sec{margin-bottom:24px}
    .sec-t{font-size:14.5px}
    .card{padding:16px;border-radius:14px;margin-bottom:14px}
    .card-title{font-size:16px}
    .card-sub{font-size:13px}
    .summary{font-size:14.5px}

    /* Thumb-sized actions with generous separation */
    .actions{gap:10px;margin-top:16px}
    .actions .btn{min-height:48px;padding:10px 15px;font-size:14.5px;border-radius:11px}
    .actions .btn.primary{flex:1 1 100%;min-height:50px;font-size:15.5px}
    .actions .btn:not(.primary){flex:1 1 calc(50% - 6px)}
    .actions .btn.later-btn{flex:0 0 auto;min-width:96px;margin-left:0 !important}

    .fv-actions .btn{min-height:46px;padding:9px 14px;font-size:14px;border-radius:10px}
    .tlink{min-height:38px;padding:7px 12px;font-size:13px}
    .seg{min-height:40px;padding:7px 13px;font-size:13.5px}

    /* Extra-safe Roll back zone on phone */
    .danger-zone{margin-top:28px;padding:16px;flex-direction:column;align-items:stretch;gap:14px}
    .danger-zone .btn.danger{width:100%;min-height:50px;font-size:15px}

    /* Progress project cards on phone */
    .st-row{
      display:grid;
      grid-template-columns:12px minmax(0,1fr) auto;
      grid-template-areas:"dot name state" ". msg msg" ". meta meta";
      gap:4px 10px;
      padding:14px 15px;
      align-items:center;
    }
    .st-row .dot{grid-area:dot}
    .st-row .st-name{grid-area:name;font-size:15.5px}
    .st-row .st-state{grid-area:state;justify-self:end}
    .st-row .st-msg{grid-area:msg;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;line-height:1.45;color:var(--text2);margin-top:2px}
    .st-row .st-meta{grid-area:meta;font-size:12px;color:var(--muted);margin-top:4px;gap:8px}
    .st-row .st-meta .st-state{display:none}
    .st-state-mob{display:inline-flex !important}

    /* Files tree comfortable touch rows */
    .node{height:46px;border-radius:9px;margin:1px 4px}
    .node .name{font-size:15px}
    .node .chev{width:24px;font-size:11px}
    .node .ico{width:24px}
    .node:hover .hov{display:none}
    .node:hover .badges .hide-hov{display:inline}

    /* Usage rows on phone */
    .u-row{grid-template-columns:108px 1fr 42px;min-height:42px;padding:7px 6px}
    .u-name{font-size:13.5px}
    .u-pct{font-size:13px}

    /* Toast sits cleanly ABOVE the bottom tab bar so thumbs never hide it */
    .toast{
      left:14px;right:14px;max-width:none;
      bottom:calc(var(--navH) + env(safe-area-inset-bottom) + 12px);
      padding:13px 16px;font-size:14.5px;border-radius:13px;
    }

    /* Bottom sheet confirmation modal for Roll back on phone */
    .modal-back{align-items:flex-end;padding:0}
    .modal-card{max-width:none;border-radius:20px 20px 0 0;border-left:0;border-right:0;border-bottom:0;padding:22px 18px calc(24px + env(safe-area-inset-bottom))}
    .modal-actions{flex-direction:column;gap:14px}
    .modal-actions .btn{width:100%;min-height:52px;font-size:15.5px;border-radius:12px}

    /* Bottom tab bar */
    .m-nav{
      display:grid;grid-template-columns:repeat(5,1fr);
      position:fixed;bottom:0;left:0;right:0;z-index:55;
      height:calc(var(--navH) + env(safe-area-inset-bottom));
      padding:4px 4px env(safe-area-inset-bottom);
      background:rgba(9,9,11,.96);backdrop-filter:blur(12px);
      border-top:1px solid var(--line);
    }
    .m-tab{
      position:relative;border:0;background:transparent;color:var(--muted);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
      border-radius:11px;cursor:pointer;font-size:11px;font-weight:600;
      transition:color .12s,background .12s,transform .08s;min-width:0;padding:0 2px;
    }
    .m-tab:active{transform:scale(.95);background:#181820}
    .m-tab.on{color:#ffffff;background:#171821}
    .m-tab.on::before{content:'';position:absolute;top:2px;width:22px;height:2.5px;border-radius:99px;background:var(--green)}
    .m-tab.on.hot-tab::before{background:var(--amber)}
    .m-badge{
      position:absolute;top:5px;right:calc(50% - 22px);
      min-width:18px;height:18px;padding:0 4px;border-radius:999px;
      background:var(--amber);color:#09090b;font-size:10.5px;font-weight:750;
      border:2px solid #09090b;
      display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;
    }
    .m-badge.ok{background:var(--green)}
  }
  .st-state-mob{display:none}

  /* ===================== HOPPER / BENCH (Pure-Black Signal) ===================== */
  .desk-switch{display:inline-flex;gap:4px;background:#111116;border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:20px}
  .desk-sw-btn{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .12s,color .12s}
  .desk-sw-btn:hover{color:var(--text)}
  .desk-sw-btn.on{background:#1c1c24;color:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
  .desk-sw-cnt{font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;background:#12251c;color:var(--green);border:1px solid #264f3c;font-variant-numeric:tabular-nums}

  .h-drop-wrap{margin-bottom:14px}
  .h-drop-bar{display:flex;gap:8px;align-items:flex-end;background:#101015;border:1px solid var(--line2);border-radius:13px;padding:7px 7px 7px 13px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .h-drop-bar:focus-within{border-color:#2f8560}
  .h-drop-in{flex:1;min-width:0;border:0;background:transparent;color:#fff;font:inherit;font-size:15px;line-height:1.45;outline:none;padding:8px 0;resize:none;overflow-y:hidden;min-height:40px;max-height:220px;word-break:break-word;white-space:pre-wrap}
  .h-drop-in::placeholder{color:var(--dim)}
  .h-drop-send{flex:none;min-height:42px;padding:0 16px;border-radius:9px}

  .h-hint-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .h-hint-chip{border:1px solid var(--line2);background:#121218;color:var(--muted);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;transition:background .12s,border-color .12s,color .12s,transform .08s;min-height:32px}
  .h-hint-chip:hover{border-color:#444454;color:var(--text)}
  .h-hint-chip:active{transform:scale(.96)}
  .h-hint-chip.on{background:#12251c;border-color:#2f8560;color:#9ef2c8}

  .h-ct-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#0e0e14;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .h-ct-pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:650;border:1px solid var(--line2);background:#16161d;color:var(--text2);max-width:100%}
  .h-ct-pill.live{background:rgba(61,214,140,.12);border-color:rgba(61,214,140,.38);color:#8ef0c0;box-shadow:0 0 14px rgba(61,214,140,.14)}
  .h-ct-pill.sleep{background:rgba(245,180,76,.11);border-color:rgba(245,180,76,.34);color:#ffd894}
  .h-ct-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .h-ct-pill.live .h-ct-dot{animation:pulse 1.8s infinite}
  .h-ct-status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .h-ct-status.active{color:#d6c4ff;font-weight:600}
  .h-ct-active-cnt{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:rgba(168,130,255,.16);border:1px solid rgba(168,130,255,.38);color:#dfd0ff;font-variant-numeric:tabular-nums}

  .h-shots-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;max-width:100%;-webkit-overflow-scrolling:touch}
  .h-shot-thumb{flex:none;height:124px;width:auto;max-width:220px;object-fit:cover;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#09090d;cursor:zoom-in;transition:border-color .14s,transform .12s,box-shadow .14s}
  .h-shot-thumb:hover{border-color:rgba(168,130,255,.55);box-shadow:0 0 16px rgba(168,130,255,.18);transform:translateY(-1px)}

  .h-box.itch .h-lbl{color:var(--violet)}
  .h-box.clicks .h-lbl{color:#e0b8ff}
  .h-clicks-list{margin:3px 0 0;padding-left:17px;color:var(--text2);font-size:13px;line-height:1.45}
  .h-clicks-list li{margin:2px 0}
  .h-weak-det{background:#0b0b10;border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:9px 12px;margin-bottom:12px}
  .h-weak-det summary{cursor:pointer;font-size:11.5px;font-weight:650;color:var(--muted);list-style:none;display:flex;align-items:center;justify-content:space-between;user-select:none}
  .h-weak-det summary:hover{color:var(--text)}
  .h-weak-det summary::-webkit-details-marker{display:none}
  .h-weak-det summary::after{content:'▸';color:var(--dim);font-size:11px}
  .h-weak-det[open] summary::after{content:'▾'}
  .h-weak-det .h-val{margin-top:6px;font-size:13px;color:var(--text2)}
  .h-det-stack{display:grid;gap:8px;margin-top:10px}
  .h-tag.slot{color:#e2d4ff;background:rgba(168,130,255,.16);border-color:rgba(168,130,255,.4);box-shadow:0 0 10px rgba(168,130,255,.14)}
  .h-tag.hint{color:#9ef2c8;background:rgba(61,214,140,.12);border-color:rgba(61,214,140,.34)}
  .h-tag.steer{color:#e2d4ff;background:rgba(168,130,255,.15);border-color:rgba(168,130,255,.36);font-variant-numeric:tabular-nums}

  /* ===================== CARETAKER WORKBENCH CHECK-IN (On Deck Card) ===================== */
  .h-card{background:#111117;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .h-card.bench-card{border-color:rgba(168,130,255,.26);background:radial-gradient(120% 60% at 10% -10%,rgba(168,130,255,.09),transparent 58%),linear-gradient(180deg,#13131b 0%,#0e0e14 100%);box-shadow:0 12px 34px rgba(0,0,0,.44),inset 0 1px 0 rgba(255,255,255,.07)}
  .h-card.run-card{border-color:rgba(168,130,255,.24);background:#121119}
  .h-card.halt-card{border-color:#4f2428;background:#181012}

  .h-caretaker-summary{font-size:13.5px;color:#d2d2de;line-height:1.5;margin:0 0 12px;word-break:break-word}
  .bench-card .h-title{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
  .h-preview-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .h-opt-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:11px;border:1px solid rgba(168,130,255,.34);background:rgba(168,130,255,.10);color:#efe8ff;font-size:13px;font-weight:650;text-decoration:none;transition:background .14s,border-color .14s,box-shadow .14s,transform .08s;min-height:42px}
  .h-opt-btn:hover{background:rgba(168,130,255,.19);border-color:rgba(201,178,255,.58);box-shadow:0 0 18px rgba(168,130,255,.20);color:#fff}
  .h-opt-btn:active{transform:scale(.97)}
  .h-opt-btn.h-open-live{border-color:rgba(61,214,140,.42);background:linear-gradient(135deg,rgba(61,214,140,.18),rgba(168,130,255,.12));color:#e6fff2;box-shadow:0 0 16px rgba(61,214,140,.14)}
  .h-opt-btn.h-open-live:hover{border-color:rgba(110,231,183,.65);background:linear-gradient(135deg,rgba(61,214,140,.26),rgba(168,130,255,.18));box-shadow:0 0 22px rgba(61,214,140,.24)}
  .h-opt-arrow{opacity:.72;font-size:12px}

  .h-checkin{background:rgba(10,10,15,.82);border:1px solid rgba(168,130,255,.22);border-radius:13px;padding:13px;margin-bottom:13px;display:flex;flex-direction:column;gap:11px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .h-ci-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .h-ci-who{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#f5f5f8}
  .h-ci-ava{width:22px;height:22px;border-radius:7px;object-fit:cover;border:1px solid rgba(184,242,75,.55);box-shadow:0 0 8px rgba(184,242,75,.28)}
  .h-ci-saved{font-size:11px;font-weight:650;color:#8ef0c0;opacity:.92}
  .h-ci-lbl{font-size:11.5px;font-weight:650;color:#a5a5b8;margin-bottom:5px}

  .h-pulse-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .h-pulse-btn{min-height:40px;padding:7px 8px;border-radius:10px;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.035);color:#b8b8c8;font-size:12.5px;font-weight:650;cursor:pointer;transition:all .14s ease;text-align:center;line-height:1.25}
  .h-pulse-btn:hover{border-color:rgba(255,255,255,.24);color:#fff;background:rgba(255,255,255,.07)}
  .h-pulse-btn:active{transform:scale(.97)}
  .h-pulse-btn.on.p-track{background:rgba(61,214,140,.17);border-color:rgba(61,214,140,.56);color:#c2fce0;box-shadow:0 0 16px rgba(61,214,140,.22)}
  .h-pulse-btn.on.p-twist{background:rgba(245,180,76,.17);border-color:rgba(245,180,76,.56);color:#ffe4ad;box-shadow:0 0 16px rgba(245,180,76,.22)}
  .h-pulse-btn.on.p-missed{background:rgba(244,114,182,.16);border-color:rgba(244,114,182,.54);color:#ffd4ec;box-shadow:0 0 16px rgba(244,114,182,.22)}

  .h-q-block{display:flex;flex-direction:column;gap:6px}
  .h-q-text{font-size:12.5px;font-weight:600;color:#e4e4ee;line-height:1.35}
  .h-chip-row{display:flex;flex-wrap:wrap;gap:6px}
  .h-ci-chip{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#b8b8c8;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;min-height:34px;transition:all .14s ease}
  .h-ci-chip:hover{border-color:rgba(168,130,255,.42);color:#fff}
  .h-ci-chip.on{background:rgba(168,130,255,.20);border-color:rgba(168,130,255,.58);color:#f3ecff;box-shadow:0 0 14px rgba(168,130,255,.22)}

  .h-react-list{display:flex;flex-direction:column;gap:5px}
  .h-react-pill{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:9px;background:rgba(244,114,182,.08);border:1px solid rgba(244,114,182,.26);font-size:12px;color:#f0dff0}
  .h-react-pill.is-note{background:rgba(168,130,255,.09);border-color:rgba(168,130,255,.28);color:#e6dcff}

<script>
const $ = (s) => document.querySelector(s);
const esc = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isPhone = () => window.matchMedia('(max-width: 860px)').matches;

const state = {
  sel: localStorage.getItem('sel') || null,
  tab: location.hash === '#hopper' ? 'hopper' : location.hash === '#needs' ? 'needs' : (localStorage.getItem('mtab') || 'needs'),
  deskView: location.hash === '#hopper' ? 'hopper' : location.hash === '#needs' ? 'board' : (localStorage.getItem('deskView') || 'board'),
  open: new Set(JSON.parse(localStorage.getItem('open') || '["lab","core"]')),
  kids: new Map(), board: null, hopper: null, graveOpen: false, parkedOpen: false, playbookEditing: false, playbookDraft: null, dropHint: '', focus: null, flagging: null, showLog: false, rawMode: false,
  usage: null, openPool: null, lastLeftHTML: '', lastLeftSel: null, lastTab: null,
  connected: true, busy: new Map(), pendingRollback: null, hopperModal: null, deferRender: false,
};

function autoGrow(el, maxH = 220){
  if (!el) return;
  el.style.height = 'auto';
  const next = Math.min(el.scrollHeight, maxH);
  el.style.height = next + 'px';
  el.style.overflowY = el.scrollHeight > maxH ? 'auto' : 'hidden';
}

async function get(url){ const r = await fetch(url); const j = await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||r.statusText); return j; }
async function api(url, body){
  let r; try { r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}); }
  catch(e){ toast('The Foundry helper is not answering, so nothing happened.', 'err'); throw e; }
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ toast(j.error||'Action failed', 'err'); throw new Error(j.error||'Action failed'); }
  return j;
}

function toast(msg, kind='info'){
  const t=$('#toast'), ico=$('#tIco'), m=$('#tMsg');
  const k = kind === true ? 'err' : kind === false ? 'info' : kind;
  ico.textContent = k === 'ok' ? '✓' : k === 'err' ? '!' : '·';
  m.textContent = msg;
  t.className = 'toast show' + (k === 'ok' ? ' ok' : k === 'err' ? ' err' : '');
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = 'toast'; }, k === 'err' ? 6500 : 3000);
}

function setLiveBadge(ok){
  state.connected = ok;
  const el = $('#mLive'); if (!el) return;
  el.textContent = ok ? 'Live' : 'Reconnecting…';
  el.className = 'm-live' + (ok ? '' : ' off');
}

function ago(iso){ if(!iso) return ''; const s=(Date.now()-new Date(iso))/1000; if(s<60)return 'now'; if(s<3600)return Math.round(s/60)+'m'; if(s<86400)return Math.round(s/3600)+'h'; return Math.round(s/86400)+'d'; }
function cap(s=''){ return s ? s[0].toUpperCase()+s.slice(1) : ''; }

// Visible per-button feedback that survives DOM re-renders
async function runBtnAction(key, btn, { busyText, doneText, run }){
  if (state.busy.get(key)) return;
  state.busy.set(key, { mode: 'busy', label: busyText });
  if (btn) {
    btn.disabled = true;
    btn.classList.add('is-busy');
    btn.innerHTML = `<span class="spin"></span><span>${esc(busyText)}</span>`;
  }
  try {
    const res = await run();
    state.busy.set(key, { mode: 'done', label: doneText });
    if (btn && btn.isConnected) {
      btn.classList.remove('is-busy');
      btn.classList.add('is-done');
      btn.innerHTML = `<span>✓ ${esc(doneText)}</span>`;
    }
    toast(doneText, 'ok');
    // the card he acted on steps back at once, so a click shows it landed before the board has rebuilt
    const card = btn && btn.closest && btn.closest('.card');
    if (card) card.classList.add('handled');
    await refreshAll();
    setTimeout(() => {
      if (state.busy.get(key)?.mode === 'done') { state.busy.delete(key); renderLeft(); }
    }, 1100);
    return res;
  } catch (e) {
    state.busy.set(key, { mode: 'err', label: 'Failed' });
    if (btn && btn.isConnected) {
      btn.classList.remove('is-busy');
      btn.classList.add('is-err');
      btn.disabled = false;
      btn.innerHTML = `<span>! Failed</span>`;
    }
    setTimeout(() => {
      if (state.busy.get(key)?.mode === 'err') { state.busy.delete(key); renderLeft(); }
    }, 1800);
    return null;
  }
}

function btnStateAttrs(key, defaultLabel){
  const st = state.busy.get(key);
  if (!st) return { cls: '', dis: '', html: esc(defaultLabel) };
  if (st.mode === 'busy') return { cls: ' is-busy', dis: ' disabled', html: `<span class="spin"></span><span>${esc(st.label)}</span>` };
  if (st.mode === 'done') return { cls: ' is-done', dis: ' disabled', html: `<span>✓ ${esc(st.label)}</span>` };
  return { cls: ' is-err', dis: '', html: `<span>! ${esc(st.label)}</span>` };
}

function md(src=''){
  const blocks = String(src).replace(/\r\n/g,'\n').split(/```/);
  return blocks.map((b,i)=> i%2 ? `<pre><code>${esc(b.replace(/^\w*\n/,''))}</code></pre>` : b.split(/\n{2,}/).map(par=>{
    const trimmed = par.trim(); if (!trimmed) return '';
    if (/^---+$/.test(trimmed)) return '<hr>';
    const lines = trimmed.split('\n');
    const inline = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>').replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
    if (lines.every(l=>/^\s*>\s?/.test(l))) return '<blockquote>'+lines.map(l=>inline(l.replace(/^\s*>\s?/,''))).join('<br>')+'</blockquote>';
    if (lines.every(l=>/^\s*[-*]\s/.test(l))) return '<ul>'+lines.map(l=>'<li>'+inline(l.replace(/^\s*[-*]\s/,''))+'</li>').join('')+'</ul>';
    if (lines.every(l=>/^\s*\d+\.\s/.test(l))) return '<ol>'+lines.map(l=>'<li>'+inline(l.replace(/^\s*\d+\.\s/,''))+'</li>').join('')+'</ol>';
    const h = trimmed.match(/^(#{1,3})\s+(.*)$/);
    if (h && lines.length===1) return `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    return '<p>'+lines.map(inline).join('<br>')+'</p>';
  }).join('')).join('');
}

// ---------- tree ----------
async function loadKids(p){ state.kids.set(p, await get('/api/tree?path='+encodeURIComponent(p))); }
async function refreshTree(){
  const paths = ['', ...[...state.open]];
  await Promise.all(paths.map(p => loadKids(p).catch(()=>{ state.open.delete(p); })));
  renderTree();
}
function saveOpen(){ localStorage.setItem('open', JSON.stringify([...state.open])); }
async function toggle(p){
  if (state.open.has(p)) state.open.delete(p); else { state.open.add(p); if(!state.kids.has(p)) await loadKids(p); }
  saveOpen(); renderTree();
}
function collapseAll(){ state.open.clear(); saveOpen(); renderTree(); }
function renderTree(){
  const rows = [];
  const walk = (p, depth) => {
    for (const n of (state.kids.get(p) || [])) {
      const isOpen = n.dir && state.open.has(n.path);
      const badges = [];
      if (n.flags) badges.push(`<span class="ind flag">⚑ ${n.flags}</span>`);
      if (n.pinned) badges.push(`<span class="ind pin">${ICON.pin}</span>`);
      else if (n.pinnedInside && !isOpen) badges.push(`<span class="ind pin" style="opacity:.45">${ICON.pin}</span>`);
      if (n.repo){
        if (n.repo.state==='ahead') badges.push(`<span class="ind up hide-hov">↑${n.repo.ahead}</span>`);
        if (n.repo.state==='diverged') badges.push(`<span class="ind split hide-hov">split</span>`);
        if (n.repo.changes) badges.push(`<span class="ind chg hide-hov">● ${n.repo.changes}</span>`);
        if (n.repo.version && n.path.startsWith('core/')) badges.push(`<span class="ind hide-hov">${esc(n.repo.version)}</span>`);
      }
      const guides = Array.from({length:depth},(_,i)=>`<span class="guide" style="left:${18+i*16}px"></span>`).join('');
      const icon = n.repo ? ICON.repo() : n.dir ? ICON.folder(isOpen) : ICON.file(n.name);
      rows.push(`<div class="node ${state.sel===n.path?'sel':''}" data-p="${esc(n.path)}" data-dir="${n.dir?1:''}" style="padding-left:${10+depth*16}px">
        ${guides}<span class="chev ${isOpen?'open':''}">${n.dir?'▶':''}</span><span class="ico">${icon}</span>
        <span class="name">${esc(n.name)}</span>
        <span class="badges">${badges.join('')}<span class="hov">
          <button class="hb" data-act="pin" title="Current focus" style="${n.pinned?'color:var(--violet)':''}">${ICON.pin}</button>
          <button class="hb" data-act="flag" title="Flag" style="color:var(--amber)">${ICON.flag}</button>
        </span></span></div>`);
      if (isOpen) walk(n.path, depth+1);
    }
  };
  walk('', 0);
  $('#tree').innerHTML = rows.join('') || '<div class="quiet" style="padding:16px">Empty</div>';
}
$('#tree').addEventListener('click', async (e) => {
  const row = e.target.closest('.node'); if (!row) return;
  const p = row.dataset.p, act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'pin') { const pinned = state.board?.pins.some(x=>x.path===p); await api(pinned?'/api/unpin':'/api/pin',{path:p}); toast(pinned?'Removed from focus':'Added to Current Focus', 'ok'); return; }
  if (act === 'flag') { select(p, true); return; }
  if (isPhone()) {
    // On phone: tapping a top room folder expands it; tapping a repo or file opens it in the inspector
    if (row.dataset.dir && !p.includes('/')) { toggle(p); return; }
    if (row.dataset.dir && e.target.closest('.chev')) { toggle(p); return; }
    if (row.dataset.dir && !state.open.has(p)) toggle(p);
    select(p);
    return;
  }
  if (row.dataset.dir && (e.target.closest('.chev') || state.sel === p)) toggle(p);
  else if (row.dataset.dir && !state.open.has(p)) toggle(p);
  select(p);
});

// ---------- selection / focus ----------
async function select(p, flag=false){
  state.sel = p; state.flagging = flag ? {for:'antigravity', tag:'Review', send:true} : null;
  p ? localStorage.setItem('sel', p) : localStorage.removeItem('sel');
  syncBodyClasses();
  renderTree();
  if (p) {
    state.lastLeftHTML = '';
    $('#left').innerHTML = `<div class="inspector"><div class="ins-head">${repoHeaderHTML(p)}<button class="btn icon-close" style="margin-left:auto" onclick="select(null)" title="Close">✕</button></div><div class="ins-stat"><span class="spin"></span> Loading…</div></div>`;
  }
  const focusP = p ? get('/api/focus?path='+encodeURIComponent(p)).catch(()=>null) : Promise.resolve(null);
  const boardP = loadBoard();
  state.focus = await focusP;
  if (p && !state.focus) { state.sel = null; localStorage.removeItem('sel'); syncBodyClasses(); }
  if (state.sel === p) renderLeft();
  if (flag) setTimeout(()=>$('#flagNote')?.focus(), 30);
  await boardP;
  if (state.sel === p) renderLeft();
}
async function reveal(p){
  const parts = p.split('/'); let acc='';
  for (let i=0;i<parts.length-1;i++){ acc = acc?acc+'/'+parts[i]:parts[i]; state.open.add(acc); if(!state.kids.has(acc)) await loadKids(acc).catch(()=>{}); }
  saveOpen(); await select(p);
  document.querySelector(`.node[data-p="${CSS.escape(p)}"]`)?.scrollIntoView({block:'center'});
}

  if (Number.isInteger(slot) && slot >= 1 && slot <= 3) {
    const port = 7990 + slot;
    if (location.hostname.endsWith('.ts.net')) return `https://${location.hostname}:${port}/`;
    return `http://127.0.0.1:${port}/`;
  }
  return c.liveMount || `/hopper/live/${c.id}/`;

  const sr = c.showroom || {};
  if (Array.isArray(sr.options) && sr.options.length) return sr.options;
  const txt = sr.swing || c.bet || '';
  const m = txt.match(/\(A:\s*([^,)]+),\s*B:\s*([^,)]+),\s*C:\s*([^)]+)\)/i);
  if (m) {
    const clean = (s) => s.replace(/\s+(?:paste launcher|live fork.*|switchboard.*)$/i, '').trim().slice(0, 34);

      { id: 'a', label: `A · ${clean(m[1])}`, path: '/?concept=a' },
      { id: 'b', label: `B · ${clean(m[2])}`, path: '/?concept=b' },
      { id: 'c', label: `C · ${clean(m[3])}`, path: '/?concept=c' },
    ];
  }
  return [];
}
